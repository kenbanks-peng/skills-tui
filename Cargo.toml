[package]
name = "skills-tui"
version = "1.0.0"
edition = "2024"
description = "A terminal UI for managing agent skills"
license = "MIT"
repository = "https://github.com/kenbanks-peng/skills-tui"

[dependencies]
anyhow = "1"
crossterm = "0.29"
fs2 = "0.4"
ratatui = "0.30"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
tempfile = "3"
toml = "0.9"
toml_edit = "0.25.17"
url = "2"
walkdir = "2"

[profile.release]
lto = "thin"
strip = true
